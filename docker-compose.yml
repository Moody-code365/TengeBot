version: '3.8'

services:
  tengebot:
    build: .
    container_name: tengebot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - CACHE_TTL_SECONDS=86400
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge